name: Flutter CI

# Roda a cada push na main e em todo pull request, garantindo que o código
# sempre analise limpo e passe nos testes antes de ser mesclado.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - name: Baixa as dependências
        run: flutter pub get

      - name: Análise estática (flutter analyze)
        run: flutter analyze

      - name: Testes (flutter test)
        run: flutter test
